name: Desktop
on:
  pull_request:
    paths: ['desktop/**', 'src/**', 'public/**', 'index.html', 'package.json', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      release:
        description: GitHub Releases に公開する（desktop/package.json の version をタグ v<version> にする）
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Butcher-Windows
          path: desktop/dist/*.exe
      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v は公開済みです。desktop/package.json の version を上げてください。"; exit 1; fi
          gh release create "v$v" desktop/dist/Butcher-Setup-$v.exe --target "$GITHUB_SHA" --title "Butcher $v" --notes ""
