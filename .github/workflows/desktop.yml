name: Desktop
on:
  pull_request:
    paths: ['desktop/**', 'src/**', 'public/**', 'index.html', 'package.json', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      release:
        description: GitHub Releases に公開する（desktop/package.json の version をタグ v<version> にする）
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Butcher-Windows
            script: dist
            files: desktop/dist/*.exe
          - os: macos-latest
            name: Butcher-Mac
            script: dist:mac
            files: desktop/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Verify signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 desktop/dist/mac-universal/Butcher.app && codesign -dv desktop/dist/mac-universal/Butcher.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v は公開済みです。desktop/package.json の version を上げてください。"; exit 1; fi
          gh release create "v$v" out/Butcher-Setup-$v.exe out/Butcher-$v.dmg --target "$GITHUB_SHA" --title "Butcher $v" --notes ""
